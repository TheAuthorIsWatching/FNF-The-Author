<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FNF: THE AUTHOR</title>
<style>
:root{--red:#e32636;--dark:#09070b;--panel:#171219;--white:#f6f1f5;--muted:#a9a0ad}
*{box-sizing:border-box}
body{margin:0;background:#050407;color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
#app{min-height:100vh;display:grid;place-items:center;padding:12px;background:radial-gradient(ellipse at 50% 45%,#351019 0%,#100910 48%,#030305 100%)}
#frame{position:relative;width:min(100%,1100px);aspect-ratio:16/9;max-height:94vh;overflow:hidden;border:2px solid #68202d;box-shadow:0 0 35px #7c102c55;background:#0b080d}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px);mix-blend-mode:overlay;z-index:10}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
#menu{align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#100b14dd,#070609f5),radial-gradient(ellipse at center,#70111d,#070609)}
.eyebrow{font-size:clamp(10px,1.3vw,15px);letter-spacing:.35em;color:#e68b97;text-transform:uppercase}
.logo{margin:.08em 0;color:#f5eaf0;font-weight:1000;font-size:clamp(48px,9vw,105px);letter-spacing:-.07em;line-height:.95;text-shadow:5px 5px 0 #7e1427,0 0 28px #f21e3b55;transform:skew(-4deg)}
.subtitle{margin:10px 0 24px;color:#c5b4c3;letter-spacing:.22em;font-size:clamp(10px,1.4vw,15px)}
.menuButtons{display:grid;gap:9px;width:min(310px,70%)}
.menuBtn{border:1px solid #792536;background:#160d15;color:#f8edf2;padding:12px 18px;text-align:left;letter-spacing:.1em;font-weight:800;transition:.12s;box-shadow:inset 3px 0 #4a1221}
.menuBtn:before{content:"▶";display:inline-block;color:#ed344c;margin-right:12px;opacity:0}
.menuBtn:hover,.menuBtn:focus{outline:none;transform:translateX(4px);background:#35111f;border-color:#f13b52}
.menuBtn:hover:before,.menuBtn:focus:before{opacity:1}
.small{font-size:11px;color:#8d818f;letter-spacing:.08em;margin-top:19px;text-align:center}
#subMenu{align-items:center;justify-content:center;flex-direction:column;padding:24px;background:linear-gradient(135deg,#100b14,#260d18)}
.panelTitle{font-size:clamp(28px,5vw,52px);font-weight:1000;letter-spacing:-.04em;text-shadow:3px 3px #781629;margin:0 0 8px}
.panelText{max-width:620px;text-align:center;color:#c8bdc9;line-height:1.5;margin:0 0 22px}
.subButtons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.actionBtn{background:#1b101a;border:1px solid #9d2a40;color:#fff;padding:11px 18px;font-weight:800}
.actionBtn:hover{background:#4b1424}
#game{background:linear-gradient(#120b15,#08070c);flex-direction:column}
.hud{height:15%;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:10px 3%;gap:12px;background:#08060bd9;border-bottom:1px solid #4c1b2a}
.trackName{font-weight:900;letter-spacing:.08em;font-size:clamp(11px,1.6vw,17px)}
.trackName span{display:block;color:#a79aa9;font-size:.72em;font-weight:500;margin-top:4px}
.stats{text-align:right;font-variant-numeric:tabular-nums;color:#e8dce5;font-size:clamp(10px,1.5vw,15px);line-height:1.6}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#35121e,#110b15 55%,#07060a)}
#moon{position:absolute;top:7%;left:50%;width:clamp(75px,13vw,140px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:#6d1828;box-shadow:0 0 40px #a11a3655;opacity:.55}
#moon:after{content:"";position:absolute;inset:8%;border:2px solid #bd344a;border-radius:50%;opacity:.6}
#silhouette{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:clamp(95px,17vw,180px);height:68%;background:linear-gradient(90deg,#030305,#10090f 55%,#030305);clip-path:polygon(40% 0,60% 0,66% 13%,77% 21%,71% 36%,83% 57%,100% 100%,59% 100%,50% 67%,39% 100%,0 100%,22% 55%,30% 33%,27% 18%);filter:drop-shadow(0 0 18px #a31c35)}
.eye{position:absolute;top:16%;width:7%;height:2%;background:#f52c49;box-shadow:0 0 12px #ff183f}
.eye.left{left:39%}.eye.right{right:39%}
#laneArea{position:absolute;inset:0;display:flex;justify-content:center;gap:clamp(5px,1.3vw,15px);padding:0 10px}
.lane{position:relative;width:clamp(42px,8.4vw,86px);height:100%;background:#09070b66;border-left:1px solid #ffffff0c;border-right:1px solid #ffffff0c}
.receptor{position:absolute;top:77%;left:50%;transform:translate(-50%,-50%);width:72%;aspect-ratio:1;border:3px solid var(--lane);border-radius:10px;display:grid;place-items:center;color:var(--lane);font-size:clamp(22px,4vw,40px);font-weight:900;text-shadow:0 0 10px var(--lane);background:#0a070bbd;box-shadow:0 0 13px color-mix(in srgb,var(--lane) 25%,transparent);z-index:2}
.receptor.hit{background:color-mix(in srgb,var(--lane) 30%,#0a070b);transform:translate(-50%,-50%) scale(1.08)}
.note{position:absolute;left:50%;width:72%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:10px;border:3px solid var(--lane);background:color-mix(in srgb,var(--lane) 24%,#100b13);color:var(--lane);display:grid;place-items:center;font-size:clamp(22px,4vw,40px);font-weight:900;box-shadow:0 0 18px color-mix(in srgb,var(--lane) 45%,transparent);z-index:3}
#judgement{position:absolute;top:62%;left:50%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(18px,3vw,30px);letter-spacing:.08em;text-shadow:2px 2px #080508;pointer-events:none}
#bottomBar{height:12%;min-height:45px;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid #451622;background:#08060b}
.keyHint{border:1px solid #4e2a37;background:#130c14;color:#bcaebc;padding:7px 10px;font-size:clamp(10px,1.3vw,13px)}
#pause{position:absolute;inset:0;background:#050307eF;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#pause.show{display:flex}
#pause h2{font-size:clamp(30px,5vw,52px);margin:0;color:#f1e6ee}
#toast{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);font-size:12px;color:#e8cbd5;background:#170b14dd;border:1px solid #6e2235;padding:7px 12px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media(max-width:600px){#frame{aspect-ratio:9/16;max-height:95vh;width:min(100%,440px)}.hud{height:12%}#bottomBar{height:10%}#silhouette{height:60%}.logo{font-size:clamp(44px,13vw,70px)}.menuButtons{width:78%}}
</style>
</head>
<body>
<div id="app"><main id="frame" aria-label="FNF The Author prototype">
<section id="menu" class="screen active">
<div class="eyebrow">A fan-made browser prototype</div>
<h1 class="logo">THE AUTHOR</h1>
<div class="subtitle">FRIDAY NIGHT FUNKIN' // WEEK 1: THE ARRIVAL</div>
<div class="menuButtons">
<button class="menuBtn" data-screen="story">STORY MODE</button>
<button class="menuBtn" data-screen="freeplay">FREEPLAY</button>
<button class="menuBtn" data-screen="options">OPTIONS</button>
<button class="menuBtn" data-screen="credits">CREDITS</button>
</div>
<div class="small">A DARK RHYTHM PROTOTYPE · PRESS ENTER TO SELECT</div>
</section>
<section id="subMenu" class="screen">
<h2 class="panelTitle" id="subTitle">STORY MODE</h2>
<p class="panelText" id="subText"></p>
<div class="subButtons" id="subButtons"></div>
</section>
<section id="game" class="screen">
<header class="hud">
<div class="trackName">THE ARRIVAL <span>THE AUTHOR — DEMO CHART</span></div>
<div class="stats"><div id="score">SCORE: 0</div><div id="accuracy">HITS: 0 · MISSES: 0</div></div>
</header>
<div id="stage">
<div id="moon"></div><div id="silhouette"><i class="eye left"></i><i class="eye right"></i></div>
<div id="laneArea"></div>
<div id="judgement">READY?</div><div id="toast"></div>
<div id="pause"><h2>PAUSED</h2><button class="actionBtn" id="resumeBtn">RESUME</button><button class="actionBtn" id="restartBtn">RESTART SONG</button><button class="actionBtn" id="quitBtn">BACK TO MENU</button></div>
</div>
<div id="bottomBar"><span class="keyHint">← / A</span><span class="keyHint">↓ / S</span><span class="keyHint">↑ / W</span><span class="keyHint">→ / D</span><span class="keyHint">ESC: PAUSE</span></div>
</section>
<div id="grain"></div>
</main></div>
<script>
(() => {
const $ = id => document.getElementById(id);
const screens = [...document.querySelectorAll('.screen')];
const laneColors = ['#55dfff','#55ef9a','#d66aff','#ff526f'];
const arrows = ['←','↓','↑','→'];
let selected = 0, currentMenu = 'menu', subReturn = 'menu', songStart = 0, raf = 0;
let notes = [], score = 0, hits = 0, misses = 0, combo = 0, paused = false, pauseAt = 0, finished = false;
const menuItems = [...document.querySelectorAll('.menuBtn')];
function showScreen(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));currentMenu=id;}
menuItems.forEach((b,i)=>b.addEventListener('click',()=>openSub(b.dataset.screen)));
function openSub(kind){
subReturn='menu'; $('subTitle').textContent=kind==='story'?'STORY MODE':kind==='freeplay'?'FREEPLAY':kind==='options'?'OPTIONS':'CREDITS';
const text={story:'Week 1: The Arrival. The road is empty, the sky is wrong, and something has noticed you. Start the demo chart when you are ready.',freeplay:'Choose the currently available demo track. More songs can be added as the chart and music assets are built.',options:'Prototype settings. Use the keyboard or click the on-screen controls are not available yet; browser audio can be added with a song file later.',credits:'FNF: THE AUTHOR is an unofficial fan-made browser prototype. Friday Night Funkin’ and its characters belong to their respective creators. This prototype uses original placeholder visuals and no official game assets.'};
$('subText').textContent=text[kind];
const btns=$('subButtons');btns.innerHTML='';
if(kind==='story'||kind==='freeplay'){const start=document.createElement('button');start.className='actionBtn';start.textContent=kind==='story'?'START WEEK 1':'PLAY: THE ARRIVAL';start.onclick=()=>startGame();btns.append(start);}
if(kind==='options'){const info=document.createElement('div');info.className='panelText';info.textContent='Controls: Arrow keys or A / S / W / D. Enter confirms menus. Escape pauses gameplay.';btns.append(info);}
const back=document.createElement('button');back.className='actionBtn';back.textContent='BACK';back.onclick=()=>showScreen('menu');btns.append(back);showScreen('subMenu');
}
const laneArea=$('laneArea');
laneColors.forEach((c,i)=>{const lane=document.createElement('div');lane.className='lane';lane.style.setProperty('--lane',c);lane.dataset.lane=i;const receptor=document.createElement('div');receptor.className='receptor';receptor.textContent=arrows[i];receptor.id='rec'+i;lane.append(receptor);laneArea.append(lane);});
const beatMs=500, firstBeat=1800, chart=[];
/* Original deterministic demo chart; each tuple is [beat, lane]. */
[[0,0],[1,1],[2,2],[3,3],[4,0],[4.5,1],[5,2],[6,3],[7,2],[8,1],[8.5,0],[9,3],[10,0],[11,2],[12,1],[12.5,3],[13,0],[14,2],[15,1],[16,3],[16.5,2],[17,1],[18,0],[19,3],[20,2],[20.5,1],[21,0],[22,3],[23,2],[24,0],[24.5,3],[25,1],[26,2],[27,0],[28,1],[28.5,2],[29,3],[30,0],[31,1],[32,2],[33,3],[34,1],[35,0],[36,3],[36.5,2],[37,1],[38,0],[39,2],[40,3],[41,1],[42,0],[43,2],[44,1],[44.5,3],[45,0],[46,2],[47,3],[48,0],[48.5,1],[49,2],[50,3],[51,1],[52,0],[53,2],[54,3],[55,0],[56,1],[56.5,2],[57,3],[58,2],[59,1],[60,0],[61,3],[62,1],[63,2],[64,0]].forEach(([beat,lane])=>chart.push({time:firstBeat+beat*beatMs,lane,hit:false,missed:false,el:null}));
const hitWindow=150, speed=.42, targetY=0.77;
function resetSong(){
cancelAnimationFrame(raf);notes=[];laneArea.querySelectorAll('.note').forEach(n=>n.remove());
chart.forEach(n=>{n.hit=false;n.missed=false;n.el=null;notes.push(n);});
score=0;hits=0;misses=0;combo=0;paused=false;finished=false;$('pause').classList.remove('show');$('judgement').textContent='GET READY';$('score').textContent='SCORE: 0';$('accuracy').textContent='HITS: 0 · MISSES: 0';
}
function startGame(){showScreen('game');resetSong();songStart=performance.now();raf=requestAnimationFrame(loop);}
function elapsed(now){return now-songStart;}
function spawnNote(n){if(n.el)return;const el=document.createElement('div');el.className='note';el.style.setProperty('--lane',laneColors[n.lane]);el.textContent=arrows[n.lane];laneArea.children[n.lane].append(el);n.el=el;}
function loop(now){
if(paused||currentMenu!=='game')return;
const t=elapsed(now), stageH=$('stage').clientHeight, target=stageH*targetY;
notes.forEach(n=>{
if(n.hit||n.missed)return;
const until=n.time-t;
if(until<2600&&until>-500)spawnNote(n);
if(n.el){const y=target-until*speed;n.el.style.top=y+'px';if(until < -hitWindow){n.missed=true;n.el.remove();n.el=null;misses++;combo=0;$('judgement').textContent='MISS';updateStats();}}
});
if(t>firstBeat+64*beatMs+2500){finished=true;$('judgement').textContent='DEMO CLEAR';$('toast').textContent='Demo chart complete — press ESC to return to menu';$('toast').classList.add('show');return;}
raf=requestAnimationFrame(loop);
}
function updateStats(){$('score').textContent='SCORE: '+score;$('accuracy').textContent='HITS: '+hits+' · MISSES: '+misses+' · COMBO: '+combo;}
function hitLane(lane){
if(currentMenu!=='game'||paused||finished)return;
const t=elapsed(performance.now());let best=null,dist=Infinity;
notes.forEach(n=>{if(n.lane!==lane||n.hit||n.missed)return;const d=Math.abs(n.time-t);if(d<dist){dist=d;best=n;}});
const receptor=$('rec'+lane);receptor.classList.add('hit');setTimeout(()=>receptor.classList.remove('hit'),90);
if(best&&dist<=hitWindow){best.hit=true;if(best.el){best.el.remove();best.el=null;}hits++;combo++;score+=Math.max(50,Math.round(350*(1-dist/hitWindow)));$('judgement').textContent=dist<55?'SICK!':dist<100?'GOOD':'OK';updateStats();}
else{$('judgement').textContent='MISS';misses++;combo=0;updateStats();}
}
function togglePause(){if(currentMenu!=='game')return;if(!paused){paused=true;pauseAt=performance.now();cancelAnimationFrame(raf);$('pause').classList.add('show');}else{paused=false;songStart+=performance.now()-pauseAt;$('pause').classList.remove('show');raf=requestAnimationFrame(loop);}}
$('resumeBtn').onclick=togglePause;$('restartBtn').onclick=startGame;$('quitBtn').onclick=()=>{cancelAnimationFrame(raf);showScreen('menu');};
const keyLane={'ArrowLeft':0,'a':0,'A':0,'ArrowDown':1,'s':1,'S':1,'ArrowUp':2,'w':2,'W':2,'ArrowRight':3,'d':3,'D':3};
document.addEventListener('keydown',e=>{
if(keyLane[e.key]!==undefined){e.preventDefault();hitLane(keyLane[e.key]);return;}
if(e.key==='Escape'){e.preventDefault();if(currentMenu==='game')togglePause();else if(currentMenu==='subMenu')showScreen('menu');return;}
if(e.key==='Enter'){
if(currentMenu==='menu'){openSub(menuItems[selected].dataset.screen);}
else if(currentMenu==='subMenu'){const first=$('subButtons').querySelector('button');if(first)first.click();}
}
if(currentMenu==='menu'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+menuItems.length)%menuItems.length;menuItems.forEach((b,i)=>b.style.outline=i===selected?'2px solid #e32636':'none');}
});
let toastTimer;
window.addEventListener('blur',()=>{if(currentMenu==='game'&&!paused)togglePause();});
})();
</script>
</body>
</html>
